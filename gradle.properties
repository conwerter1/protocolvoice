# Global JVM and Gradle settings
# Win11 build 26200 fix: AF_UNIX connect0 returns Invalid argument.
# Pointing unixdomain.tmpdir to nonexistent dir forces PipeImpl TCP fallback.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:/nope
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

systemProp.com.sun.net.ssl.checkRevocation=false
systemProp.trust_all_cert=true
